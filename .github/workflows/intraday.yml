name: Intraday Trading Pipeline

on:
  schedule:
    # Intraday ticks: every 30 minutes from 13:30 to 20:00 UTC, Mon-Fri.
    # EDT (UTC-4): 09:30–16:00 ET. EST (UTC-5): 08:30–15:00 ET.
    # The window is tight enough that no tick fires after 16:00 ET in
    # either DST regime. The pipeline double-checks via is_market_open_now().
    # This cron is a belt-and-suspenders backup — the primary trigger is
    # the self-perpetuating chain job below.
    - cron: "*/30 13-19 * * 1-5"
    - cron: "0 20 * * 1-5"
    # End-of-day wrap-up: writes the EOD perf row, generates the daily
    # report, and sends the daily summary alert. Fires at 21:00 UTC =
    # 17:00 ET in DST / 16:00 ET in standard time — safely after close.
    # This run does NOT execute trades.
    - cron: "0 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: intraday | end-of-day"
        required: false
        default: "intraday"
        type: choice
        options:
          - intraday
          - end-of-day
      force:
        description: "Bypass market-open check"
        required: false
        default: "false"
  # External kick from cron-job.org (or any other cron-as-a-service).
  # POST to /repos/{owner}/{repo}/dispatches with
  #   {"event_type": "market-open-kick"}
  # at 13:00 UTC Mon-Fri to start the daily chain. GitHub's own cron
  # often delays the first tick of the day by 10-20 minutes; an
  # external trigger lands on time, then our self-chain job handles
  # every subsequent tick until close.
  repository_dispatch:
    types: [market-open-kick]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# Stop overlapping ticks from racing to commit data — if a previous run is
# still going, the new one waits its turn.
concurrency:
  group: intraday-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve run mode
        id: mode
        env:
          # `force` is an UNCONSTRAINED string dispatch input interpolated into a
          # run: block — the Actions script-injection sink. Bound to an env var so
          # the shell reads it as data and never parses it as script.
          #
          # ASYMMETRY, deliberate: `mode` is left interpolated because it is
          # `type: choice` and GitHub validates it against its options list
          # (intraday | end-of-day) before the job starts, so it cannot carry
          # arbitrary text. `github.event_name` and `github.event.schedule` are
          # GitHub-controlled and likewise not attacker-settable. `force` was the
          # only free-text sink in this workflow.
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          # The 21:00 UTC cron is the EOD wrap-up; everything else is intraday.
          # workflow_dispatch overrides via the `mode` input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Normalized to a strict boolean rather than passed through: only the
            # literal "true" enables force, anything else is false. This also
            # keeps a multi-line input from writing extra lines into
            # $GITHUB_OUTPUT, which a raw echo of an arbitrary string can do.
            if [ "$INPUT_FORCE" = "true" ]; then FORCE=true; else FORCE=false; fi
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "force=$FORCE" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 21 * * 1-5" ]; then
            echo "mode=end-of-day" >> $GITHUB_OUTPUT
            echo "force=false" >> $GITHUB_OUTPUT
          else
            echo "mode=intraday" >> $GITHUB_OUTPUT
            echo "force=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          # News intelligence (all optional — pipeline runs without them)
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          # Email alerting (Gmail SMTP). Recipients are a secret, never
          # committed — the repo is public and settings.json is not a safe home
          # for them (same rule as COMPETITOR_ALERT_TO). Unset = no email sent.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          # Liveness heartbeat — external dead-man's-switch ping URL (Healthchecks.io).
          # Unset = the in-process heartbeat is a clean no-op (src/alerts/heartbeat.py).
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          FORCE="${{ steps.mode.outputs.force }}"
          ARGS=""
          if [ "$MODE" = "end-of-day" ]; then
            ARGS="--end-of-day"
          else
            ARGS="--intraday"
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "Running: python -m src.pipeline $ARGS"
          python -m src.pipeline $ARGS

      - name: Commit + push updated data
        run: |
          git config user.name "llm-trading-lab-bot"
          git config user.email "actions@github.com"
          git add data/ logs/ reports/daily/ docs/MODEL_CHANGELOG.md || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          MODE="${{ steps.mode.outputs.mode }}"
          git commit -m "${MODE} tick $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Push with rebase-and-retry. A benign concurrent commit (the
          # competitor-monitor job, keepalive, a human push) or a transient
          # network blip must NOT fail the tick AND break the self-chain.
          # Retry up to 5x, rebasing onto the latest remote each attempt.
          # We never force-push: a genuine rebase conflict fails loud so
          # notify-failure fires, rather than clobbering the other commit.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed ${MODE} tick [attempt ${attempt}]"
              exit 0
            fi
            echo "::warning::push attempt ${attempt}/5 failed — aborting any partial rebase and retrying"
            git rebase --abort 2>/dev/null || true
            sleep $(( attempt * 5 ))
          done
          echo "::error::Could not push tick data after 5 attempts — failing loud so notify-failure fires."
          exit 1

  # Holiday short-circuit gate. On a non-trading day (NYSE calendar — the same
  # pandas_market_calendars source the pipeline's own market-open check uses)
  # the chain job's ~30-minute sleep-and-dispatch loop and the pages deploy are
  # pure CI-minutes churn: the pipeline no-ops every tick all day. `chain` and
  # `pages` skip via this job's output; the `run` job is NOT gated — it stays
  # the market-state authority (is_market_open_now) and keeps firing from the
  # backup crons. FAIL-OPEN by construction: the script prints "true" on any
  # internal failure, the pip install is best-effort, and the job is
  # continue-on-error — a gate infrastructure failure must never kill the
  # chain on a real trading day (downstream conditions treat anything but an
  # explicit "false" as open).
  # Alerting preflight. DELIBERATELY STANDALONE — `needs` nothing, and nothing
  # needs it. `chain` gates on `success()` of `run`, so putting this inside the
  # `run` job would stop the trading day over a missing email address. As its
  # own job its failure reds the workflow run (visible in the Actions UI, and
  # GitHub notifies the actor through its own channel, not ours) while
  # run -> chain proceeds untouched.
  #
  # It must not depend on email to report an email fault: a missing recipient
  # list disables the very notifier that would announce it. The non-zero exit
  # IS the signal. Stdlib-only, no pip install.
  alerting-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the daily alerting channel can deliver
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
        run: python scripts/check_alerting_config.py --channel daily

  gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      trading: ${{ steps.check.outputs.trading }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install calendar dependency (best-effort)
        run: pip install "pandas>=2.2.0" "pandas-market-calendars>=4.4.0" || true
      - name: Trading-day check
        id: check
        run: echo "trading=$(python scripts/check_trading_day.py)" >> "$GITHUB_OUTPUT"

  # Self-perpetuating chain. After each successful intraday tick:
  #   * If still inside market hours (< 20:00 UTC), sleep to the next
  #     30-minute boundary (:00 or :30) and dispatch intraday.yml again.
  #   * If market has closed (>= 20:00 UTC EDT), sleep until ~21:05 UTC
  #     (giving close prices time to settle) and dispatch the EOD
  #     wrap-up run with mode=end-of-day.
  # The chain is now the PRIMARY trigger for both intraday ticks AND the
  # EOD wrap-up. The `0 21 * * 1-5` cron on the workflow is retained as a
  # belt-and-suspenders backup for the rare case where this chain job
  # itself fails — log_daily_snapshot is idempotent on date so a
  # double-fire writes exactly one row per day.
  chain:
    needs: [run, gate]
    runs-on: ubuntu-latest
    # Holiday short-circuit: skip on an explicit non-trading-day verdict from
    # the gate (fail-open — a missing/failed gate output reads as open).
    # workflow_dispatch force=true bypasses the gate like it bypasses the
    # pipeline's own market-open check.
    if: >-
      success() && github.event.schedule != '0 21 * * 1-5' && github.event.inputs.mode != 'end-of-day'
      && (needs.gate.outputs.trading != 'false' || github.event.inputs.force == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Symptom-level monitor for the now-continue-on-error `pages` job: a
      # genuine, persistent Pages outage would otherwise be silent. This checks
      # the LIVE public dashboard's generated_at and pages us only if it is more
      # than 3h behind wall-clock during an established session (12:30–16:00 ET).
      # Stdlib-only — no pip install. continue-on-error so the monitor can never
      # red the chain and trip the very CRITICAL alert we just scoped away.
      - name: Monitor deployed dashboard staleness
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
        run: python scripts/check_dashboard_staleness.py
      - name: Chain next tick (intraday or EOD)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # jq is preinstalled on ubuntu-latest; guard anyway so a future image
          # change degrades to "skip verify" rather than failing every dispatch.
          HAVE_JQ=1
          command -v jq >/dev/null 2>&1 || { echo "::warning::jq not found — run-creation verify skipped (status-check + retry stay active)"; HAVE_JQ=0; }

          # Latest intraday.yml run id (monotonic); 0 if none/unreadable.
          latest_run_id() {
            [ "$HAVE_JQ" = "1" ] || { echo 0; return 0; }
            curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/actions/workflows/intraday.yml/runs?per_page=1" \
              | jq -r '.workflow_runs[0].id // 0' 2>/dev/null || echo 0
          }

          # One dispatch POST. Echoes the HTTP status ("000" on transport error);
          # the response body (empty on a 204 success) is left in /tmp/disp_body.
          attempt_dispatch() {
            local payload="$1" code
            code=$(curl -sS -o /tmp/disp_body -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/actions/workflows/intraday.yml/dispatches" \
              -d "$payload") || code="000"
            echo "$code"
          }

          # After a 204, confirm a NEW run actually appeared (absorbs API
          # propagation lag). PURE verification — never used to trigger a
          # re-dispatch; a false negative here must not re-fire the dispatch.
          verify_run_created() {
            local before="$1" i latest
            [ "$HAVE_JQ" = "1" ] || { echo "Skipping run-creation verify (no jq)"; return 0; }
            for i in 1 2 3 4 5 6; do
              sleep 6
              latest=$(latest_run_id)
              if [ "${latest:-0}" -gt "${before:-0}" ]; then
                echo "Confirmed new run id ${latest} (baseline ${before}) after ~$(( i * 6 ))s"
                return 0
              fi
            done
            echo "No new run id above baseline ${before} after grace window"
            return 1
          }

          # Dispatch with status-checking + retry. Retries ONLY on a definitive
          # non-204 HTTP status (a curl transport error -> "000" also counts),
          # with backoff. On 204 it stops retrying and verifies run creation.
          # If all 4 attempts are non-204, OR a 204 yields no run, it returns
          # non-zero so the chain job fails RED and notify-failure fires — no
          # more silent green. The verify result NEVER triggers a re-dispatch.
          dispatch_with_retry() {
            local payload="$1" label="$2" before attempt code
            before=$(latest_run_id)
            for attempt in 1 2 3 4; do
              code=$(attempt_dispatch "$payload")
              if [ "$code" = "204" ]; then
                echo "Dispatch accepted (HTTP 204) for ${label} [attempt ${attempt}]"
                if verify_run_created "$before"; then
                  return 0
                fi
                echo "::error::Dispatch for ${label} returned 204 but no new run appeared — NOT re-dispatching; failing loud."
                return 1
              fi
              echo "::warning::Dispatch attempt ${attempt}/4 for ${label} failed: HTTP ${code} — body: $(cat /tmp/disp_body 2>/dev/null)"
              if [ "$attempt" -lt 4 ]; then
                sleep $(( attempt * 5 ))
              fi
            done
            echo "::error::All 4 dispatch attempts for ${label} failed (last HTTP ${code}). Failing the chain so notify-failure fires."
            return 1
          }

          dispatch_intraday() {
            dispatch_with_retry '{"ref":"main","inputs":{"mode":"intraday","force":"false"}}' "intraday"
          }

          dispatch_eod() {
            # Wait until 21:05 UTC (1h 5m after EDT market close) so prices
            # settle, then dispatch mode=end-of-day. If already past 21:05,
            # dispatch after a 30s safety buffer.
            local h m s now target wait
            h=$(date -u +%H); m=$(date -u +%M); s=$(date -u +%S)
            now=$(( 10#$h * 3600 + 10#$m * 60 + 10#$s ))
            target=$(( 21 * 3600 + 5 * 60 ))
            wait=$(( target - now ))
            if [ "$wait" -lt 30 ]; then
              wait=30
            fi
            echo "Market closed — waiting ${wait}s before EOD dispatch..."
            sleep "$wait"
            dispatch_with_retry '{"ref":"main","inputs":{"mode":"end-of-day","force":"false"}}' "end-of-day"
          }

          NOW_MIN=$(date -u +%M)
          NOW_SEC=$(date -u +%S)
          NOW_HOUR=$(date -u +%H)
          NOW_DOW=$(date -u +%u)  # 1=Mon..7=Sun

          # Stop chain on weekends (shouldn't happen, but be safe)
          if [ "$NOW_DOW" -gt 5 ]; then
            echo "Weekend — stopping chain"
            exit 0
          fi

          # Post-close: chain to the EOD wrap-up instead of another tick.
          # The EOD run itself won't re-trigger this chain job because the
          # top-level `if:` excludes mode=end-of-day.
          if [ "$NOW_HOUR" -ge 20 ]; then
            dispatch_eod
            exit 0
          fi

          # Intraday path: sleep to the next 30-minute boundary (:00 or
          # :30) + 30s buffer so the dispatch lands after the wall-clock
          # minute rolls.
          MIN_MOD=$(( 10#$NOW_MIN % 30 ))
          WAIT=$(( (30 - MIN_MOD) * 60 - 10#$NOW_SEC + 30 ))
          if [ "$WAIT" -lt 60 ]; then
            WAIT=$(( WAIT + 1800 ))
          fi
          echo "Sleeping ${WAIT}s until next tick..."
          sleep "$WAIT"

          # If we crossed 20:00 UTC during the sleep, chain to EOD
          # instead of dispatching another intraday.
          POST_HOUR=$(date -u +%H)
          if [ "$POST_HOUR" -ge 20 ]; then
            echo "Crossed 20:00 UTC during sleep — chaining to EOD"
            dispatch_eod
            exit 0
          fi

          dispatch_intraday

  pages:
    needs: [run, gate]
    runs-on: ubuntu-latest
    # A GitHub Pages deploy timeout is a cosmetic publishing hiccup, not a
    # trading failure — it must not red the workflow. continue-on-error keeps a
    # failed deploy from failing the run; the dashboard-staleness monitor in the
    # `chain` job escalates a genuine, persistent publish outage instead.
    # Holiday short-circuit: nothing changed on a non-trading day, so the
    # deploy is skipped on an explicit gate "false" (fail-open otherwise;
    # force=true bypasses).
    continue-on-error: true
    if: >-
      success()
      && (needs.gate.outputs.trading != 'false' || github.event.inputs.force == 'true')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Ensure we have the latest main (run job just pushed new data)
      - run: git pull origin main
      - name: Copy data into dashboard artifact
        run: |
          mkdir -p dashboard/data
          cp data/dashboard.json dashboard/data/dashboard.json
          # Stamp asset version into index.html so browsers can't serve a
          # cached shell that references stale JS/CSS. The JSON itself is
          # already cache-busted at fetch time inside app.js.
          VERSION="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          sed -i "s/__ASSET_VERSION__/${VERSION}/g" dashboard/index.html
          echo "Asset version: ${VERSION}"
      - name: Copy report PDFs into dashboard artifact
        run: |
          # Pages publishes only dashboard/. Copy the monthly report PDFs into
          # the artifact (CI-ephemeral — nothing is committed) preserving the
          # reports/monthly/<month>/ path, so reports/monthly/2026-05/...pdf
          # serves at /reports/monthly/2026-05/...pdf and the link pattern stays
          # stable for every future month. PDFs only: data_layer.json and the
          # provenance script remain in the repo (each report cites its source
          # commit for the underlying data).
          find reports/monthly -type f -name '*.pdf' -print -exec cp --parents {} dashboard/ \;
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      # Deploy with a longer timeout and one bounded retry. GitHub Pages
      # occasionally needs longer than deploy-pages' 10-minute default to report
      # the deployment live (the failure mode in today's incident); a
      # slow-but-eventual deploy shouldn't be discarded. Attempt 1 is step-level
      # continue-on-error so the retry step is reached; the retry fires only if
      # attempt 1 aborted. The job is continue-on-error, so even both attempts
      # failing can't red the workflow. Worst case (two 15-min attempts) is
      # bounded by and hidden under the parallel `chain` job's ~30-min sleep, so
      # the tick cadence is unchanged.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
      - name: Deploy (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000

  # If any upstream job fails (pipeline run, self-chain, or Pages deploy),
  # send a single [ALERT] email so a hard failure the in-process alerter
  # can't self-report still reaches the inbox.
  notify-failure:
    needs: [run, chain, pages]
    # CRITICAL alerts are scoped to the trading-critical jobs only. A `pages`
    # (dashboard publish) failure is cosmetic: it stays visible as red in the
    # Actions tab and is escalated by the dashboard-staleness monitor in the
    # `chain` job if it genuinely persists — but it must NOT page as CRITICAL.
    # `!cancelled()` lets this job evaluate even when an upstream job failed; the
    # explicit result checks keep it from firing on cancellation or on a
    # pages-only failure. `pages` stays in `needs` so its status still shows in
    # the FAILED_CONTEXT line when run/chain do fail.
    if: ${{ !cancelled() && (needs.run.result == 'failure' || needs.chain.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send failure email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          RUN_MODE: ${{ needs.run.result == 'failure' && 'pipeline run' || 'workflow' }}
          FAILED_CONTEXT: "run=${{ needs.run.result }} chain=${{ needs.chain.result }} pages=${{ needs.pages.result }}"
        run: python scripts/notify_failure.py
