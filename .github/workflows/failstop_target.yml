name: Fail-stop Target (dummy)

# THROWAWAY. The dummy workflow the fail-stop live probe disables
# (.github/workflows/failstop_probe.yml). It does nothing but sleep, holds no
# secret and touches no file. It exists so the probe never has to act on
# intraday.yml. Delete both files once the probe's three answers are ledgered.
#
# Its concurrency group mirrors intraday.yml's (cancel-in-progress: false), so
# a second dispatch while the first is running waits as a pending run. That is
# the "queued run of the disabled workflow" whose fate the probe observes.
on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: failstop-target
  cancel-in-progress: false

jobs:
  sleep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sleep (a stand-in for a tick)
        run: sleep 240
