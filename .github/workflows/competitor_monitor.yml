name: Competitor Monitor — weekly arXiv/SSRN scan

on:
  schedule:
    # Every Monday at 14:00 UTC. Scans the prior week for new LLM-trading
    # research and commits a dated digest to reports/.
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days (use 365 for a first-run backfill)"
        required: false
        default: "7"
      test_alert:
        description: "Fire ONE synthetic ESCALATE alert instead of scanning (proves the channel end to end; writes no digest and no index rows)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Don't let a manual run race the scheduled one for the commit.
concurrency:
  group: competitor-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Dispatch inputs are bound to environment variables ONCE, here, and every
    # step below reads the env var. They are never interpolated into a `run:`
    # block with ${{ }}.
    #
    # This is not stylistic. `${{ }}` inside `run:` is substituted into the
    # script TEXT before the shell parses it, so an input value containing shell
    # metacharacters becomes executable code — the standard GitHub Actions
    # script-injection sink. Binding to env makes the value data: the shell
    # reads it from the environment and never parses it as script. Dispatching
    # this workflow requires repo write access, so the practical exposure was
    # low, but the sink was real and is closed here.
    #
    # `if:` conditions are a different context — expressions there are evaluated
    # by the Actions expression engine, not a shell — but they read the same env
    # vars anyway so there is one source of truth per input.
    env:
      INPUT_DAYS: ${{ github.event.inputs.days }}
      INPUT_TEST_ALERT: ${{ github.event.inputs.test_alert }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Preflight BEFORE the scan. Failing early is correct here: no trading is
      # at stake, and a scan that cannot escalate is precisely the defect that
      # went unnoticed on 2026-08-13/14 (wired code, absent secret, silent
      # skip). The monitor's own main() asserts the same thing; this step makes
      # the fault legible before a full arXiv pull runs.
      - name: Verify the escalation channel can deliver
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COMPETITOR_ALERT_TO: ${{ secrets.COMPETITOR_ALERT_TO }}
        run: python scripts/check_alerting_config.py --channel competitor

      # Two modes. The scheduled run always scans; a dispatch with the
      # test_alert toggle fires one synthetic ESCALATE alert instead, which is
      # the only way to prove this channel end to end from Actions — a
      # zero-hit scan proves nothing. The test path writes no digest and no
      # index rows (scripts/competitor_monitor.py --test-alert).
      - name: Run competitor scan
        run: |
          # Inputs are read from the environment. Never template-interpolate a
          # dispatch input into this script — see the job-level env comment.
          if [ "$INPUT_TEST_ALERT" = "true" ]; then
            echo "TEST ALERT mode — firing one synthetic escalation, no scan, no digest"
            python -m scripts.competitor_monitor --test-alert 2>&1 | tee scan.log
          else
            DAYS="${INPUT_DAYS:-7}"
            echo "Scanning last ${DAYS} days"
            python -m scripts.competitor_monitor --days "$DAYS" 2>&1 | tee scan.log
          fi
        env:
          # Escalation alerting. Recipient is a secret, never committed — the
          # repo is public and settings.json is not a safe home for it.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COMPETITOR_ALERT_TO: ${{ secrets.COMPETITOR_ALERT_TO }}

      # Skipped in test-alert mode: that path emits no heartbeat by design, and
      # the "MISSING — treat as a monitor failure" fallback below would then
      # report a fault that did not happen.
      - name: Surface the heartbeat
        if: always() && env.INPUT_TEST_ALERT != 'true'
        run: |
          # The heartbeat must be visible without opening a file, including on
          # empty weeks — that is the whole point of emitting it. Lands in the
          # Actions run summary as well as the digest body.
          HB="$(grep -o '\[heartbeat\].*' scan.log | tail -1 || true)"
          if [ -z "$HB" ]; then
            HB="[heartbeat] MISSING — the scan did not emit one; treat as a monitor failure."
          fi
          echo "## Competitor monitor" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$HB" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ESC="$(grep -o '[0-9]\+ escalations' scan.log | tail -1 | cut -d' ' -f1 || echo 0)"
          if [ "${ESC:-0}" != "0" ]; then
            echo "**${ESC} ESCALATION(S) — relay to the hub today.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Belt and braces: --test-alert writes nothing, so the staged-diff check
      # below would already exit clean. Skipping outright makes it impossible
      # for a channel test to touch the repo at all.
      - name: Commit + push digest
        if: env.INPUT_TEST_ALERT != 'true'
        run: |
          git config user.name "llm-trading-lab-bot"
          git config user.email "actions@github.com"
          git add reports/competitor_digest_*.md || true
          # The structured index is the queryable series behind the digests —
          # it must land in the same commit, or the markdown and the index
          # drift apart week by week.
          git add reports/competitor_index.jsonl || true
          if git diff --cached --quiet; then
            echo "No digest changes to commit"
            exit 0
          fi
          git commit -m "competitor digest $(date -u +%Y-%m-%d)"
          # Rebase-and-retry push (same rationale as intraday.yml): tolerate a
          # benign concurrent commit or a transient blip without failing the
          # weekly scan. Never force-push.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed competitor digest [attempt ${attempt}]"
              exit 0
            fi
            echo "::warning::push attempt ${attempt}/5 failed — aborting any partial rebase and retrying"
            git rebase --abort 2>/dev/null || true
            sleep $(( attempt * 5 ))
          done
          echo "::error::Could not push competitor digest after 5 attempts."
          exit 1
