# Release notes

This page documents updates to the Gemini API.

## November 19, 2026  {% id=&quot;11-19-2026&quot; %}

*   **Genie 4 (`genie-4`) generally available (GA)**: Released
    [Genie 4](/docs/models/genie-4) (`genie-4`) on the
    [Interactions API](/docs/genie) (`v1beta`) for real-time interactive world
    generation, streaming steerable 24 fps 16:9 video with synchronized
    48 kHz stereo audio over WebRTC and WebSockets. Seed worlds from text, a
    16:9 reference image, or both, and steer live with WASD/arrow keys and
    mid-session text events. Available on the paid tier at
    [pricing](/docs/pricing#genie-4) of $1.50 per 1M input tokens, $9.00
    per 1M text output tokens, and $17.50 per 1M video output tokens
    (~$0.10/sec, stereo audio included); see
    [Interactive world generation with Genie 4](/docs/genie), the
    [Genie 4 prompt and controls guide](/docs/genie-prompting), and
    [rate limits](/docs/rate-limits#genie-4).

*   **Tool retrieval (Preview)**: The Interactions API can now search your tool
    library and load function schemas on demand, so large tool sets no longer
    have to be sent in full on every request. Mark tools with `defer_loading:
    true` and add a `{&quot;type&quot;: &quot;tool_search&quot;}` tool to let Gemini retrieve
    schemas for you, or set `execution: &quot;client&quot;` to run your own retrieval
    logic. Remote MCP servers support `defer_loading` as well.

    Tool Retrieval works with Gemini 3.6 and later models, including all Gemini
    4 models, in the Interactions API. See the
    [Tool retrieval](/docs/tool-retrieval) guide.


## November 18, 2026  {% id=&quot;11-18-2026&quot; %}

*   **Gemini 4 Neon (`gemini-4-neon`) generally available (GA)**: Released
    [Gemini 4 Neon](/docs/models/gemini-4-neon) (`gemini-4-neon`), bringing
    frontier-level intelligence with fast end-to-end task completion across
    complex software engineering, knowledge work, and science workflows.
    Available on the paid tier at [pricing](/docs/pricing#gemini-4-neon) of
    $3.00 per 1M input tokens and $15.00 per 1M output tokens, `gemini-4-neon`
    supports four [thinking levels](/docs/thinking#understanding-thinking-levels)
    (`low`, `medium`, default `high`, and `xhigh`), a unified 1M-token context
    window, and long decode up to 1M tokens. See
    [What&#39;s new in Gemini 4 Neon](/docs/whats-new-gemini-4-neon) to get started.

*   **Multimodal file processing and slicing**: You can now pass Microsoft
    Office and OpenDocument files (Word, PowerPoint, and Excel) directly to the
    Gemini API, and slice documents, spreadsheets, videos, and audio in user
    prompts and [function responses](/docs/function-calling#file-inspection-options).
    Select specific page ranges, worksheet tabs, cell ranges, time intervals, or
    content layers (such as page images, extracted text, formulas, or video
    transcripts) so you only process and pay for the content you need.

    To get started, see [Document understanding](/docs/document-processing#customize-document-processing),
    [Video understanding](/docs/video-understanding#customize-video-processing),
    and [Audio understanding](/docs/audio#clipping-intervals).


## November 17, 2026  {% id=&quot;11-17-2026&quot; %}

*   **Voice editing in Gemini 3.5 Transcribe**:
    [`gemini-3.5-transcribe`](/docs/models/gemini-3.5-transcribe) and
    `gemini-3.5-transcribe-live` now support voice-driven editing, rewriting,
    and formatting of dictated speech or pre-existing text (`source_text`). See
    the [Audio transcription](/docs/transcribe#voice-editing) and
    [Live transcription](/docs/live-api/live-transcribe#voice-editing) guides.

## November 12, 2026  {% id=&quot;11-12-2026&quot; %}

*   **Gemini 4 Hydrogen (`gemini-4-hydrogen`) generally available (GA)**: Released
    [Gemini 4 Hydrogen](/docs/models/gemini-4-hydrogen) (`gemini-4-hydrogen`),
    bringing cutting-edge intelligence to everyone, with speed and efficiency
    for everyday coding and agentic workflows.
    Available on the free tier and at paid-tier
    [pricing](/docs/pricing#gemini-4-hydrogen) of $1.50 per 1M input tokens and
    $7.50 per 1M output tokens, `gemini-4-hydrogen` introduces a fourth
    [`xhigh`](/docs/thinking#understanding-thinking-levels) thinking level alongside `low`,
    `medium`, and default `high`, and is now the default model for the
    [Antigravity agent](/docs/antigravity-agent) in Gemini Managed Agents. See
    [What&#39;s new in Gemini 4 Hydrogen](/docs/whats-new-gemini-4-hydrogen) for API
    changes and migration guidance from Gemini 3.8 Flash.

## November 11, 2026  {% id=&quot;11-11-2026&quot; %}

*   **Gemini Decision 1 and the Decisions API**: Released
    [Gemini Decision 1](/docs/models/gemini-decision-1) (`gemini-decision-1`) and
    the [Decisions API](/docs/decisions-api) for fast, calibrated binary,
    categorical, and rubric decisions across text, images, audio, video, and
    PDFs with zero output tokens. View [pricing](/docs/pricing#gemini-decision)
    and [rate limits](/docs/rate-limits#gemini-decision), or see the
    [Decisions API guide](/docs/decisions-api) to get started.

## November 10, 2026  {% id=&quot;11-10-2026&quot; %}

*   **Gemini 4 Carbon (`gemini-4-carbon`) generally available (GA)**: Released
    [Gemini 4 Carbon](/docs/models/gemini-4-carbon) (`gemini-4-carbon`), our
    most capable reasoning model built for sustained agentic coding, multimodal
    knowledge work, scientific reasoning, and cybersecurity defense, available
    at introductory [pricing](/docs/pricing#gemini-4-carbon) of $2.00 per 1M
    input tokens and $10.00 per 1M output tokens through November 30, 2026. See
    [What&#39;s new in Gemini 4 Carbon](/docs/whats-new-gemini-4-carbon) to get started.

## November 6, 2026  {% id=&quot;11-06-2026&quot; %}

*   **Gemini Embedding 2 Preview deprecation**:
    [`gemini-embedding-2-preview`](/docs/models/gemini-embedding-2-preview) is
    [deprecated](/docs/deprecations#embedding-deprecated-models). Effective
    November 6, 2026, API requests to `gemini-embedding-2-preview` route to
    [`gemini-embedding-2`](/docs/models/gemini-embedding-2) at
    [Gemini Embedding 2 rates](/docs/pricing#gemini-embedding-2). Update your
    model string to `gemini-embedding-2`. `gemini-embedding-2` uses the same API
    schema, pricing, and embedding space, so no other code changes or vector
    re-indexing are needed.

## November 5, 2026  {% id=&quot;11-05-2026&quot; %}

*   **Gemini Omni 1.2 Flash generally available (GA)**: Released
    [Gemini Omni 1.2 Flash](/docs/models/gemini-omni-flash)
    (`gemini-omni-1.2-flash`), featuring up to 15-second video generation and
    conversational editing (3 to 10 seconds for first and last frame
    interpolation, and 3 to 10 seconds per-turn video extension up to 30 seconds
    total length), improved character and subject consistency across up to 6
    reference images, 30% lower video output
    [pricing](/docs/pricing#gemini-omni-1.2-flash) ($12.00 per 1M tokens), and
    doubled paid-tier [rate limits](/docs/rate-limits#gemini-omni-flash-rate-limits).
    See the [Gemini Omni Flash guide](/docs/omni) to get started.

*   **Gemini Omni 1.1 Flash automatic routing notice**: Effective **December 3,
    2026**, API requests to `gemini-omni-1.1-flash` will automatically route to
    `gemini-omni-1.2-flash` at
    [Gemini Omni 1.2 Flash rates](/docs/pricing#gemini-omni-1.2-flash).

*   **Expanded Office and OpenDocument file support**: The Gemini API now
    accepts PowerPoint 97-2003 (PPT), OpenDocument Presentation (ODP), and
    OpenDocument Spreadsheet (ODS) files as input, and adds page-image
    processing for Word 97-2003 (DOC) files. DOC, PPT, and ODP files are
    rendered as page images. For ODS files, the model receives the data and
    formulas from the first sheet.
    Processing for DOCX, DOTX, ODT, PPTX, XLSX, and XLS files is unchanged. See
    [Office and OpenDocument files](/docs/document-processing#office-documents)
    for how each format is processed.

*   **More file types and file URIs in function responses**: Tools can now
    return Office and OpenDocument files, audio, and video to the model.

    *   **GenerateContent API**: Function response parts now accept audio,
        video, and Office and OpenDocument files, in addition to images, PDFs,
        and plain text. They also accept `fileData`, so tools can return a
        Files API URI instead of inline bytes. `displayName` is now available
        on both `inlineData` and `fileData`, and video parts accept
        `mediaProcessing` (`STATIC` or `AGENTIC`).
    *   **Interactions API**: `function_result` steps now accept `document`,
        `audio`, and `video` content blocks, in addition to `text` and `image`,
        by inline `data` or `uri`. Video blocks are available in `v1beta` and
        `v1alpha` and accept `processing`.

    See [Multimodal function responses](/docs/function-calling#multimodal)
    for details.


## November 4, 2026  {% id=&quot;11-04-2026&quot; %}

*   **Voice remixing for Gemini 3.8 TTS**: Released
    [Voice remixing](/docs/voice-remixing), which lets you modify an existing
    prebuilt or [designed](/docs/voice-design) voice using natural-language
    instructions to create a new, independent stored voice. Use
    `POST /v1beta/voices` with `gemini-3.8-flash-tts` (or remix interactively in
    [Google AI Studio](https://aistudio.google.com/generate-speech)) to generate
    a `voice_...` ID, then synthesize speech with
    [Gemini 3.8 Flash TTS](/docs/models/gemini-3.8-flash-tts) or
    [Gemini 3.8 Flash-Lite TTS](/docs/models/gemini-3.8-flash-lite-tts). See the
    [Voice remixing guide](/docs/voice-remixing) to get started.

## November 2, 2026  {% id=&quot;11-02-2026&quot; %}

*   **Gemini 2.5 Pro deprecation**:
    [`gemini-2.5-pro`](/docs/models/gemini-2.5-pro) is
    [deprecated](/docs/deprecations#gemini-2.5-pro-models) and is no longer
    available to select in Google AI Studio. Effective December 1, 2026, all API
    requests to `gemini-2.5-pro` will automatically route to
    [`gemini-3.8-flash`](/docs/models/gemini-3.8-flash) and be billed at
    [Gemini 3.8 Flash rates](/docs/pricing#gemini-3.8-flash). Before December 1,
    2026, update your model string to `gemini-3.8-flash` and review the
    [Gemini 3.8 Flash migration guide](/docs/whats-new-gemini-3.8#migrate-to-gemini-3-8-flash).
    Breaking API changes include function calling and `thought_signature`
    validation, `thinking_level` replacing `thinking_budget`, and removed
    sampling parameters and prefilled model turns.
*   **Gemini 2.5 Flash deprecation**:
    [`gemini-2.5-flash`](/docs/models/gemini-2.5-flash) is
    [deprecated](/docs/deprecations#gemini-2.5-flash-models) and is no longer
    available to select in Google AI Studio. Effective December 1, 2026, all API
    requests to `gemini-2.5-flash` will automatically route to
    [`gemini-3.5-flash-lite`](/docs/models/gemini-3.5-flash-lite) and be billed
    at [Gemini 3.5 Flash-Lite rates](/docs/pricing#gemini-3.5-flash-lite).
    Before December 1, 2026, update your model string to `gemini-3.5-flash-lite`
    and review the
    [Gemini 3.5 Flash-Lite migration guide](/docs/whats-new-gemini-3.6#migrate-to-gemini-3-5-flash-lite).
    Breaking API changes include function calling and `thought_signature`
    validation, `thinking_level` replacing `thinking_budget`, and removed
    sampling parameters and prefilled model turns.

## October 30, 2026  {% id=&quot;10-30-2026&quot; %}

*   **Computer Use generally available (GA)**: Released the
    [Computer Use](/docs/computer-use) tool to general availability (GA) across
    the Interactions and GenerateContent APIs.

## October 27, 2026  {% id=&quot;10-27-2026&quot; %}

*   **Gemini API CLI (`gemini-api`) beta**: Released the [Gemini API
    CLI](/docs/cli) (`gemini-api`), a stateless, zero-dependency command-line
    client for AI coding agents, scripts, and CI pipelines. Use `gemini-api` on
    the [Interactions API](/docs/interactions-overview) to generate text and
    media, analyze files, and run [Gemini managed agents](/docs/agents). See the
    [Gemini API CLI guide](/docs/cli) to get started.

## October 26, 2026  {% id=&quot;10-26-2026&quot; %}

*   **Generate Content API storage on by default**: New projects using the
    Generate Content API (`generateContent`, `streamGenerateContent`, and
    `batchGenerateContent`) on the paid tier now store requests by default
    (`store=true`), matching the Interactions API. Existing projects
    keep their current setting. To opt out, set `store=false` on individual
    requests or turn off Generate Content API logging in the **Settings** panel
    of the [Logs and Datasets](/logs) dashboard. See

## September 17, 2026  {% id=&quot;09-17-2026&quot; %}

*   **Antigravity Agent 09-2026**: Released `antigravity-preview-09-2026`,
    which replaces and deprecates `antigravity-preview-05-2026`.

    If you run on a remote sandbox (`environment: &quot;remote&quot;`) and read only
    `output_text` or `model_output` steps, update the agent string and nothing
    else changes.

    If you run tools locally (`local_environment`) or parse `function_call`
    steps, the built-in tools changed. Parameters use PascalCase instead of
    snake_case, and file edits use line-range replacements instead of full
    rewrites.

    | Capability | 05-2026 | 09-2026 |
    | :--- | :--- | :--- |
    | File creation | `write_file(path, content)` | `write_to_file(TargetFile, CodeContent, Overwrite, Description)` |
    | File editing | `write_file(path, content)`, full rewrite | `replace_file_content(TargetFile, StartLine, EndLine, TargetContent, ReplacementContent)` |
    | File reading | `read_file(path, offset, limit)`, byte offsets | `view_file(AbsolutePath, StartLine, EndLine, ContentOffset)` |
    | Directory listing | `list_files(path)` | `list_dir(DirectoryPath)` |
    | File and code search | None, agents used shell commands | `find_by_name(SearchDirectory, Pattern, MaxDepth)` and `grep_search(SearchPath, Query, IsRegex)` |
    | Shell execution | `code_execution(command, timeout_seconds)` | Unchanged |
    | Web search | `google_search(queries)` | Unchanged |

    See the [Antigravity Agent](/docs/antigravity-agent) guide.
    `antigravity-preview-05-2026` shuts down on October 5, 2026, tracked on the
    [deprecations](/docs/deprecations#managed-agents) page.

## April 9, 2025  {% id=&quot;04-09-2025&quot; %}

**Model updates:**

*   Released `veo-2.0-generate-001`, a generally available (GA) text- and
    image-to-video model, capable of generating detailed and artistically
    nuanced videos. To learn more, see the [Veo docs](/docs/video).

*   Released `gemini-2.0-flash-live-001`, a public preview version of the [Live
    API](/docs/live-api) model with billing enabled.

    *   **Enhanced Session Management and Reliability**

        *   **Session Resumption:** Keep sessions alive across temporary network
            disruptions. The API now supports server-side session state storage
            (for up to 24 hours) and provides handles (session_resumption) to
            reconnect and resume where you left off.

        *   **Longer Sessions via Context Compression:** Enable extended
            interactions beyond previous time limits. Configure context window
            compression with a sliding window mechanism to automatically manage
            context length, preventing abrupt terminations due to context limits.

        *   **Graceful Disconnect Notification:** Receive a `GoAway` server
            message indicating when a connection is about to close, allowing for
            graceful handling before termination.


    *   **More Control over Interaction Dynamics**

    *   **Configurable Voice Activity Detection (VAD):** Choose sensitivity
        levels or disable automatic VAD entirely and use new client events
        (`activityStart`, `activityEnd`) for manual turn control.

    *   **Configurable Interruption Handling:** Decide whether user input should
        interrupt the model&#39;s response.

    *   **Configurable Turn Coverage:** Choose whether the API processes all
        audio and video input continuously or only captures it when the end-user
        is detected speaking.

    *   **Configurable Media Resolution:** Optimize for quality or token usage
        by selecting the resolution for input media.

    *   **Richer Output and Features**

    *   **Expanded Voice &amp; Language Options:** Choose from two new voices and
        30 new languages for audio output. The output language is now configurable
        within `speechConfig`.

    *   **Text Streaming:** Receive text responses incrementally as they are
        generated, enabling faster display to the user.

    *   **Token Usage Reporting:** Gain insights into usage with detailed token
        counts provided in the `usageMetadata` field of server messages, broken
        down by modality and prompt or response phases.
